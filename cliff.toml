# git-cliff ~ configuration file
# https://git-cliff.org/docs/configuration

[bump]
features_always_bump_minor = true
breaking_always_bump_major = true
initial_tag = "0.0.1"

[changelog]
# A Tera template to be rendered as the changelog's header.
# See https://keats.github.io/tera/#getting-started
header = """
# Changelog\n
All notable changes to this project will be documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.0.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).\n\n
{% if version -%}
**Full Changelog**: https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}/compare/0.0.1...{{ version }}
{% endif -%}
"""
# A Tera template to be rendered for each release in the changelog.
# See https://keats.github.io/tera/#getting-started
body = """
{% if version -%}
## {{ timestamp | date(format="%Y-%m-%d") }}
{%- if previous and previous.version -%}
{%- set diff_url = "https://github.com/" ~ remote.github.owner ~ "/" ~ remote.github.repo ~ "/compare/" ~ previous.version ~ "..." ~ version -%}
{%- else -%}
{%- set diff_url = "https://github.com/" ~ remote.github.owner ~ "/" ~ remote.github.repo ~ "/commits/" ~ version -%}
{%- endif %}
{% else -%}
## [Unreleased]
{%- if previous and previous.version -%}
{%- set diff_url = "https://github.com/" ~ remote.github.owner ~ "/" ~ remote.github.repo ~ "/compare/" ~ previous.version ~ "...HEAD" -%}
{%- else -%}
{%- set diff_url = "" -%}
{%- endif %}
{% endif -%}
{% for commit in commits %}
{%- set fp_num = commit.footers | default(value=[]) | filter(attribute="token", value="PR-Number") | first -%}
{%- set fp_url = commit.footers | default(value=[]) | filter(attribute="token", value="PR-Url") | first -%}
{%- set fp_author = commit.footers | default(value=[]) | filter(attribute="token", value="PR-Author") | first -%}
{%- set type_icon = commit.group | split(pat=" ") | first -%}
- ({{ version | default(value="unreleased") | trim_start_matches(pat="v") }} - {% if commit.breaking %}❗ {% endif %}{{ type_icon }}) \
{% if commit.scope %}{{ commit.scope }}: {% endif %}\
{{ commit.message | upper_first | trim }}\
{% if commit.remote.pr_number and commit.remote.pr_url %} in [#{{ commit.remote.pr_number }}]({{ commit.remote.pr_url }})\
{% elif fp_num and fp_url %} in [#{{ fp_num.value }}]({{ fp_url.value }})\
{% endif %}\
{% if diff_url %} ([diff]({{ diff_url }})) {% endif %}\
{% if commit.remote.username %} by [@{{ commit.remote.username }}](https://github.com/{{ commit.remote.username }})\
{% elif fp_author %} by [@{{ fp_author.value }}](https://github.com/{{ fp_author.value }}){% endif %}
{% endfor %}
"""
# A Tera template to be rendered as the changelog's footer.
# See https://keats.github.io/tera/#getting-started
footer = """
<!-- generated by git-cliff -->
"""
# Remove leading and trailing whitespaces from the changelog's body.
trim = true

[git]
# Parse commits according to the conventional commits specification.
# See https://www.conventionalcommits.org
conventional_commits = true
# Exclude commits that do not match the conventional commits specification.
filter_unconventional = true
# An array of regex based parsers for extracting data from the commit message.
# Assigns commits to groups.
# Optionally sets the commit's scope and can decide to exclude commits from further processing.
commit_parsers = [
    { message = "^feat", group = "🚀 Features" },
    { message = "^fix", group = "🐛 Bug Fixes" },
    { message = "^doc", group = "📝 Documentation" },
    { message = "^perf", group = "⚡ Performance" },
    { message = "^refactor", group = "♻️ Refactoring" },
    { message = "^test", group = "🧪 Testing" },
    { message = "^chore\\(release\\)", group = "⚙️ Miscellaneous", skip = true },
    { message = "^chore", group = "⚙️ Miscellaneous" },
    { message = "^ci", group = "⚙️ Miscellaneous", skip = true },
    { message = "^.*", group = "🔀 Other Changes" },
]
# Prevent commits that are breaking from being excluded by commit parsers.
protect_breaking_commits = true
filter_commits = false
# Order releases topologically instead of chronologically.
topo_order = false
# Order of commits in each group/release within the changelog.
# Allowed values: newest, oldest
sort_commits = "oldest"
commit_preprocessors = [
    { pattern = "\\(#([0-9]+)\\)", replace = "[#$1](https://github.com/cloudoperators/rootstock/pull/$1)" },
]
