name: Build Docker images and push to registry

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version that will be used for the docker image'
        required: true
        type: string
      release:
        description: 'is set to true for releases'
        required: false
        type: string
        default: "false"
      platforms:
        description: 'Target platform that the image will be built for'
        required: false
        type: string
        default: |
          linux/amd64
          linux/arm64
  workflow_call:
    inputs:
      version:
        description: 'Version that will be used for the docker image'
        required: true
        type: string
      release:
        description: 'is set to true for releases'
        required: false
        type: string
        default: "false"
      platforms:
        description: 'Target platform that the image will be built for'
        required: false
        type: string
        default: |
          linux/amd64
          linux/arm64

env:
  REGISTRY: ghcr.io

permissions: {}

jobs:
  docker-build:
    name: Build
    runs-on: [ubuntu-latest]
    permissions:
      contents: read
      packages: write
      # This is used to complete the identity challenge
      # with sigstore/fulcio when running outside of PRs.
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (v7)

      - name: Check image tag does not already exist
        if: inputs.release == 'true'
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/rootstock:${{ inputs.version }}
        run: |
          if docker manifest inspect "$IMAGE" > /dev/null 2>&1; then
            echo "Image $IMAGE already exists — refusing to overwrite."
            exit 1
          fi
      # Install the cosign tool except on PR
      # https://github.com/sigstore/cosign-installer
      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3 (v4)

      # Set up QEMU for cross-platform builds
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0 (v4)

      # Set up BuildKit Docker container builder to be able to build
      # multi-platform images and export cache
      # https://github.com/docker/setup-buildx-action
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1 (v4)
        with:
          driver-opts: |
            image=moby/buildkit:latest

      # Login against a Docker registry except on PR
      # https://github.com/docker/login-action
      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0 (v4)
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Extract metadata (tags, labels) for Docker
      # https://github.com/docker/metadata-action
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0 (v6)
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/rootstock
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.version }},match=(\d.\d.\d)$,enable=${{ inputs.release }}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }},prefix=v
            type=ref,event=branch
            type=ref,event=tag
            type=ref,event=pr
            type=schedule
            type=raw,value=${{ github.sha }},enable=${{ inputs.release }}
            type=sha,enable=true,format=short,prefix=,enable=${{ inputs.release }}
            type=edge,branch=main,enable=${{ inputs.release }}

      # Build and push Docker image with Buildx (don't push on PR)
      # https://github.com/docker/build-push-action
      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0 (v7)
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # remove untagged images produced for multi platform builds
          provenance: false
          #  cache-from: type=gha
          #  cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ inputs.version }}
          platforms: ${{ inputs.platforms }}

      # Sign the resulting Docker image digest except on PRs.
      # This will only write to the public Rekor transparency log when the Docker
      # repository is public to avoid leaking data.  If you would like to publish
      # transparency data even for private images, pass --force to cosign below.
      # https://github.com/sigstore/cosign
      - name: Sign the published Docker image
        if: ${{ github.event_name != 'pull_request' }}
        env:
          # https://docs.github.com/en/actions/security-guides/security-hardening-for-github-actions#using-an-intermediate-environment-variable
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        # This step uses the identity token to provision an ephemeral certificate
        # against the sigstore community Fulcio instance.
        run: echo "${TAGS}" | xargs -I {} cosign sign --yes {}@${DIGEST}

  vulnerability-scan:
    if: inputs.release == 'true' || github.event_name == 'pull_request'
    permissions:
      contents: read
      packages: read
      security-events: write
    name: Vulnerability Scan
    needs: docker-build
    runs-on: [ubuntu-latest]
    steps:
      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0 (v4)
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: get tag
        id: tag
        run: |
          tag=pr-${{ github.event.number }}
          if ${{ inputs.release }}; then
            tag=${{ github.sha }}
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0 (v0)
        if: success()
        with:
          image-ref: ${{ env.REGISTRY }}/${{ github.repository_owner }}/rootstock:${{ steps.tag.outputs.tag }}
          ignore-unfixed: true
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH,MEDIUM"

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3 (v4)
        if: always()
        with:
          sarif_file: trivy-results.sarif
