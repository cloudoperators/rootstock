name: Update Changelog and Version

on:
  workflow_call:
    inputs:
      head_ref:
        type: string
        required: true
      pr_number:
        type: string
        required: true
      pr_title:
        type: string
        required: true
      pr_body:
        type: string
        required: false
        default: ""
      pr_url:
        type: string
        required: true
      base_sha:
        type: string
        required: true
    secrets:
      # Only the push token is needed. We intentionally do NOT use
      # `secrets: inherit` from the caller: this job operates on an untrusted
      # fork checkout, so high-value secrets (e.g. the GitHub App private key)
      # must never be in scope here.
      token:
        required: true

permissions:
  contents: write
  pull-requests: read

jobs:
  changelog:
    runs-on: ubuntu-latest
    steps:
      # The PR branch checkout is UNTRUSTED. It holds the content we describe in
      # the changelog and the ref we ultimately commit/push to. We never execute
      # any script, Makefile target, or tool config that lives in this checkout.
      - name: Checkout PR branch (untrusted)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (v7)
        with:
          fetch-depth: 0
          ref: ${{ inputs.head_ref }}
          token: ${{ secrets.token }}
          path: branch

      # The base-repo checkout at base_sha is TRUSTED. All executable tooling
      # (hack/*.sh, cliff.toml) is run from here so a malicious fork cannot
      # inject code into this privileged job.
      - name: Checkout trusted tooling (base repo)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (v7)
        with:
          fetch-depth: 0
          ref: ${{ inputs.base_sha }}
          path: trusted

      # taiki-e/install-action is not a verified Marketplace creator, so install
      # git-cliff directly from its official GitHub binary release instead,
      # following https://git-cliff.org/docs/installation/binary-releases.
      # The download comes from the pinned upstream release, not from the
      # untrusted fork checkout.
      - name: Install git-cliff
        env:
          GIT_CLIFF_VERSION: 2.14.2
        run: |
          set -euo pipefail
          version="${GIT_CLIFF_VERSION}"
          wget "https://github.com/orhun/git-cliff/releases/download/v${version}/git-cliff-${version}-x86_64-unknown-linux-gnu.tar.gz"
          tar -xvzf git-cliff-*.tar.gz
          cd "git-cliff-${version}"
          sudo mv git-cliff /usr/local/bin/

      - name: Merge main into the PR branch
        working-directory: branch
        run: |
          git fetch origin main
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --no-rebase origin main

      - name: Generate changelog entry from PR
        working-directory: branch
        env:
          PR_TITLE: ${{ inputs.pr_title }}
          PR_BODY: ${{ inputs.pr_body }}
          PR_NUMBER: ${{ inputs.pr_number }}
          PR_URL: ${{ inputs.pr_url }}
          GITHUB_TOKEN: ${{ secrets.token }}
          GITHUB_REPO: ${{ github.repository }}
          BASE_SHA: ${{ inputs.base_sha }}
          # Absolute paths to the TRUSTED tooling checkout.
          TRUSTED_DIR: ${{ github.workspace }}/trusted
          # Pinned so the untrusted checkout cannot influence which prettier runs.
          PRETTIER_VERSION: 3.10.1
        run: |
          PR_AUTHOR=$(gh api "repos/${GITHUB_REPO}/pulls/${PR_NUMBER}" --jq '.user.login')

          if [ -n "$PR_BODY" ]; then
            commit_msg=$(printf '%s\n\n%s\n\nPR-Number: %s\nPR-Url: %s\nPR-Author: %s' "$PR_TITLE" "$PR_BODY" "$PR_NUMBER" "$PR_URL" "$PR_AUTHOR")
          else
            commit_msg=$(printf '%s\n\nPR-Number: %s\nPR-Url: %s\nPR-Author: %s' "$PR_TITLE" "$PR_NUMBER" "$PR_URL" "$PR_AUTHOR")
          fi

          export COMMIT_MSG="${commit_msg}"
          export BASE_COMMIT="${BASE_SHA}"
          # Pin git-cliff to the trusted config so a fork-supplied cliff.toml
          # (which can run arbitrary commands via postprocessors) is ignored.
          export CLIFF_CONFIG="${TRUSTED_DIR}/cliff.toml"

          # Run ONLY trusted scripts from the base checkout, with cwd set to the
          # PR branch so CHANGELOG.md / VERSION.yaml are written there. We call
          # the scripts directly and never `make`, so no fork Makefile executes.
          "${TRUSTED_DIR}/hack/update_changelog.sh"
          "${TRUSTED_DIR}/hack/update_version.sh"

          # Format only the generated changelog using prettier. We must not let
          # the untrusted PR checkout influence which prettier (or which
          # plugins/config) runs, so we:
          #   * pin an exact prettier version (no fork-controlled range),
          #   * invoke npx from the TRUSTED dir so a fork-supplied
          #     node_modules/package.json cannot shadow the install,
          #   * disable config discovery (--no-config) so no fork .prettierrc
          #     can load plugins or alter behavior (Prettier 3 only loads
          #     plugins when a config or --plugin asks for them),
          #   * pass the CHANGELOG by absolute path and pin all flags.
          changelog_path="$(pwd)/CHANGELOG.md"
          ( cd "${TRUSTED_DIR}" \
            && npx --yes "prettier@${PRETTIER_VERSION}" \
                 --no-config \
                 --prose-wrap always \
                 --write "${changelog_path}" )

      - name: Commit changelog
        working-directory: branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md VERSION.yaml
          git diff --cached --quiet || git commit --signoff -m "chore: update CHANGELOG.md and VERSION.yaml [skip ci]"
          git push
