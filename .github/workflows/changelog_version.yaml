name: Update Changelog and Version

on:
  workflow_call:
    inputs:
      head_ref:
        type: string
        required: true
      pr_number:
        type: string
        required: true
      pr_title:
        type: string
        required: true
      pr_body:
        type: string
        required: false
        default: ""
      pr_url:
        type: string
        required: true
      base_sha:
        type: string
        required: true
    secrets:
      # Only the push token is needed. We intentionally do NOT use
      # `secrets: inherit` from the caller: this job operates on an untrusted
      # fork checkout, so high-value secrets (e.g. the GitHub App private key)
      # must never be in scope here. The default GITHUB_TOKEN is sufficient:
      # this workflow is constructed to ONLY ever commit and push CHANGELOG.md
      # and VERSION.yaml (enforced by a guard in the commit step) and never
      # touches files under .github/workflows/**, so the token's inability to
      # push workflow changes is never exercised.
      token:
        required: true

permissions:
  contents: write
  pull-requests: read

jobs:
  changelog:
    runs-on: ubuntu-latest
    steps:
      # The PR branch checkout is UNTRUSTED. It holds the content we describe in
      # the changelog and the ref we ultimately commit/push to. We never execute
      # any script, Makefile target, or tool config that lives in this checkout.
      - name: Checkout PR branch (untrusted)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (v7)
        with:
          fetch-depth: 0
          ref: ${{ inputs.head_ref }}
          token: ${{ secrets.token }}
          path: branch

      # The base-repo checkout at base_sha is TRUSTED. All executable tooling
      # (hack/*.sh, cliff.toml) is run from here so a malicious fork cannot
      # inject code into this privileged job.
      - name: Checkout trusted tooling (base repo)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (v7)
        with:
          fetch-depth: 0
          ref: ${{ inputs.base_sha }}
          path: trusted

      # taiki-e/install-action is not a verified Marketplace creator, so install
      # git-cliff directly from its official GitHub binary release instead,
      # following https://git-cliff.org/docs/installation/binary-releases.
      # The download comes from the pinned upstream release, not from the
      # untrusted fork checkout.
      - name: Install git-cliff
        env:
          GIT_CLIFF_VERSION: 2.14.2
        run: |
          set -euo pipefail
          version="${GIT_CLIFF_VERSION}"
          wget "https://github.com/orhun/git-cliff/releases/download/v${version}/git-cliff-${version}-x86_64-unknown-linux-gnu.tar.gz"
          tar -xvzf git-cliff-*.tar.gz
          cd "git-cliff-${version}"
          sudo mv git-cliff /usr/local/bin/

      # Merge the latest main into the PR branch BEFORE regenerating the
      # changelog. The changelog is fully regenerated from scratch and the new
      # entry is interleaved with every other unreleased entry; if the branch
      # does not reflect main's current tip, two in-flight PRs end up rewriting
      # the same region of CHANGELOG.md and the one that merges second conflicts
      # (see PRs that fail with CHANGELOG.md merge markers). Merging main here
      # keeps the branch consistent with main so the regenerated changelog lines
      # up and the final squash-merge stays conflict-free.
      - name: Merge main into the PR branch
        working-directory: branch
        run: |
          git fetch origin main
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Remote PR-branch tip before we merge main in. This is the parent the
          # pushed changelog commit must sit on top of.
          echo "PR_BRANCH_TIP=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git pull --no-rebase origin main

      - name: Generate changelog entry from PR
        working-directory: branch
        env:
          PR_TITLE: ${{ inputs.pr_title }}
          PR_BODY: ${{ inputs.pr_body }}
          PR_NUMBER: ${{ inputs.pr_number }}
          PR_URL: ${{ inputs.pr_url }}
          GITHUB_TOKEN: ${{ secrets.token }}
          GITHUB_REPO: ${{ github.repository }}
          BASE_SHA: ${{ inputs.base_sha }}
          # Absolute paths to the TRUSTED tooling checkout.
          TRUSTED_DIR: ${{ github.workspace }}/trusted
          # Pinned so the untrusted checkout cannot influence which prettier runs.
          PRETTIER_VERSION: 3.10.1
        run: |
          PR_AUTHOR=$(gh api "repos/${GITHUB_REPO}/pulls/${PR_NUMBER}" --jq '.user.login')

          if [ -n "$PR_BODY" ]; then
            commit_msg=$(printf '%s\n\n%s\n\nPR-Number: %s\nPR-Url: %s\nPR-Author: %s' "$PR_TITLE" "$PR_BODY" "$PR_NUMBER" "$PR_URL" "$PR_AUTHOR")
          else
            commit_msg=$(printf '%s\n\nPR-Number: %s\nPR-Url: %s\nPR-Author: %s' "$PR_TITLE" "$PR_NUMBER" "$PR_URL" "$PR_AUTHOR")
          fi

          export COMMIT_MSG="${commit_msg}"
          export BASE_COMMIT="${BASE_SHA}"
          # Pin git-cliff to the trusted config so a fork-supplied cliff.toml
          # (which can run arbitrary commands via postprocessors) is ignored.
          export CLIFF_CONFIG="${TRUSTED_DIR}/cliff.toml"

          # Run ONLY trusted scripts from the base checkout, with cwd set to the
          # PR branch so CHANGELOG.md / VERSION.yaml are written there. We call
          # the scripts directly and never `make`, so no fork Makefile executes.
          "${TRUSTED_DIR}/hack/update_changelog.sh"
          "${TRUSTED_DIR}/hack/update_version.sh"

          # Format only the generated changelog using prettier. We must not let
          # the untrusted PR checkout influence which prettier (or which
          # plugins/config) runs, so we:
          #   * pin an exact prettier version (no fork-controlled range),
          #   * invoke npx from the TRUSTED dir so a fork-supplied
          #     node_modules/package.json cannot shadow the install,
          #   * disable config discovery (--no-config) so no fork .prettierrc
          #     can load plugins or alter behavior (Prettier 3 only loads
          #     plugins when a config or --plugin asks for them),
          #   * pass the CHANGELOG by absolute path and pin all flags.
          changelog_path="$(pwd)/CHANGELOG.md"
          ( cd "${TRUSTED_DIR}" \
            && npx --yes "prettier@${PRETTIER_VERSION}" \
                 --no-config \
                 --prose-wrap always \
                 --write "${changelog_path}" )

      - name: Commit changelog
        working-directory: branch
        env:
          GITHUB_HEAD_REF_LOCAL: ${{ inputs.head_ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Stage ONLY the two files this workflow is ever allowed to change.
          git add CHANGELOG.md VERSION.yaml

          # Hard guard: abort if anything other than CHANGELOG.md / VERSION.yaml
          # is staged. This workflow must NEVER add or update any other file
          # (in particular nothing under .github/workflows/**, which the default
          # GITHUB_TOKEN cannot push). `git add` with explicit paths already
          # limits what is staged, but we verify the staged set defensively so a
          # future change (or an unexpected working-tree state) can never sneak
          # extra files into the pushed commit.
          staged=$(git diff --cached --name-only)
          allowed=$'CHANGELOG.md\nVERSION.yaml'
          unexpected=$(comm -23 \
            <(printf '%s\n' "$staged" | sed '/^$/d' | sort -u) \
            <(printf '%s\n' "$allowed" | sort -u))
          if [ -n "$unexpected" ]; then
            echo "error: refusing to commit unexpected files:" >&2
            printf '  %s\n' $unexpected >&2
            echo "only CHANGELOG.md and VERSION.yaml may be committed by this workflow" >&2
            exit 1
          fi

          # Nothing staged means nothing changed — that is fine, just skip.
          git diff --cached --quiet && exit 0

          # We merged main into the branch so the regenerated changelog is
          # consistent with main's current tip (preventing cross-PR CHANGELOG.md
          # conflicts). That merge, however, pulled main's entire tree into the
          # working branch. We must NOT push the merge commit or any of main's
          # other file changes — only CHANGELOG.md / VERSION.yaml.
          #
          # So instead of committing on top of the merged HEAD, we rebuild a
          # single commit whose parent is the ORIGINAL remote PR-branch tip
          # (PR_BRANCH_TIP, captured before the merge) and whose tree is that
          # tip's tree with ONLY CHANGELOG.md / VERSION.yaml overlaid. The
          # pushed delta is therefore exactly the changelog change — no merge
          # commit, no workflow-file changes — so the default GITHUB_TOKEN can
          # push it and the earlier staged-file guard's intent is preserved.
          base_tree=$(git rev-parse "${PR_BRANCH_TIP}^{tree}")
          changelog_blob=$(git rev-parse ":CHANGELOG.md")
          version_blob=$(git rev-parse ":VERSION.yaml")

          # Build the overlaid tree deterministically via a throwaway index:
          # start from the original PR-branch tip tree, then apply only the two
          # blobs on top of it.
          GIT_INDEX_FILE="$(mktemp)"
          export GIT_INDEX_FILE
          git read-tree "$base_tree"
          git update-index --add --cacheinfo "100644,${changelog_blob},CHANGELOG.md"
          git update-index --add --cacheinfo "100644,${version_blob},VERSION.yaml"
          new_tree=$(git write-tree)
          rm -f "$GIT_INDEX_FILE"
          unset GIT_INDEX_FILE

          commit=$(
            GIT_AUTHOR_NAME="github-actions[bot]" \
            GIT_AUTHOR_EMAIL="github-actions[bot]@users.noreply.github.com" \
            GIT_COMMITTER_NAME="github-actions[bot]" \
            GIT_COMMITTER_EMAIL="github-actions[bot]@users.noreply.github.com" \
            git commit-tree "$new_tree" -p "${PR_BRANCH_TIP}" \
              -m "chore: update CHANGELOG.md and VERSION.yaml [skip ci]" \
              -m "Signed-off-by: github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
          )

          # Fast-forward-safe push of exactly this one commit onto the remote
          # PR branch. Its only parent is the remote tip we read above, so this
          # is a clean fast-forward that carries just the changelog change.
          git push origin "${commit}:${GITHUB_HEAD_REF_LOCAL}"
