name: Update Changelog and Version

on:
  workflow_call:
    inputs:
      head_ref:
        type: string
        required: true
      pr_number:
        type: string
        required: true
      pr_title:
        type: string
        required: true
      pr_body:
        type: string
        required: false
        default: ""
      pr_url:
        type: string
        required: true
      base_sha:
        type: string
        required: true
    secrets:
      # Only the push token is needed. We intentionally do NOT use
      # `secrets: inherit` from the caller: this job operates on an untrusted
      # fork checkout, so high-value secrets (e.g. the GitHub App private key)
      # must never be in scope here. The default GITHUB_TOKEN is sufficient:
      # this workflow is constructed to ONLY ever commit and push CHANGELOG.md
      # and VERSION.yaml (enforced by a guard in the commit step) and never
      # touches files under .github/workflows/**, so the token's inability to
      # push workflow changes is never exercised.
      token:
        required: true

permissions:
  contents: write
  pull-requests: read

jobs:
  changelog:
    runs-on: ubuntu-latest
    steps:
      # 1) TRUSTED TOOLING — always from the HEAD of the default branch (main).
      # Every executable we run (hack/*.sh, cliff.toml, prettier invocation) is
      # taken ONLY from here, so a malicious fork can never inject code into
      # this privileged job. We deliberately pin to `main` rather than
      # inputs.base_sha: base_sha is PR-derived and, while it normally resolves
      # to the base-branch tip, anchoring to `main` guarantees we always use the
      # current trusted tooling on the default branch.
      - name: Checkout tools from HEAD of main (trusted)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (v7)
        with:
          fetch-depth: 0
          ref: main
          path: main-tools

      # 2a) REPO BASE — the base_sha checkout. This is the repository state the
      # changelog/version are constructed FROM (git history + the CHANGELOG.md /
      # VERSION.yaml / Chart.yaml base files). base_sha is a commit on main's
      # history, but we still never execute anything out of this checkout; it is
      # only read as git history and overwritten with regenerated files.
      - name: Checkout base_sha (repo base to construct from)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (v7)
        with:
          fetch-depth: 0
          ref: ${{ inputs.base_sha }}
          path: base

      # 2b) PR BRANCH — the UNTRUSTED head_ref checkout. This is the ref we
      # ultimately commit/push the two generated files onto. We never execute
      # any script, Makefile target, or tool config that lives in this checkout.
      - name: Checkout head_ref (PR branch to commit to, untrusted)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (v7)
        with:
          fetch-depth: 0
          ref: ${{ inputs.head_ref }}
          token: ${{ secrets.token }}
          path: branch

      # taiki-e/install-action is not a verified Marketplace creator, so install
      # git-cliff directly from its official GitHub binary release instead,
      # following https://git-cliff.org/docs/installation/binary-releases.
      # The download comes from the pinned upstream release, not from any
      # checkout in this job.
      - name: Install git-cliff
        env:
          GIT_CLIFF_VERSION: 2.14.2
        run: |
          set -euo pipefail
          version="${GIT_CLIFF_VERSION}"
          wget "https://github.com/orhun/git-cliff/releases/download/v${version}/git-cliff-${version}-x86_64-unknown-linux-gnu.tar.gz"
          tar -xvzf git-cliff-*.tar.gz
          cd "git-cliff-${version}"
          sudo mv git-cliff /usr/local/bin/

      # 3) + 4) Construct CHANGELOG.md and VERSION.yaml using the TOOLS FROM MAIN
      # against the BASE_SHA repo. The generated files are written INTO the base
      # checkout (via --repo-dir); the PR itself is injected as a virtual commit
      # so the not-yet-existing squash-merge is reflected, and base_sha is the
      # git-cliff range endpoint.
      - name: Construct CHANGELOG.md and VERSION.yaml (main tools, base_sha repo)
        env:
          PR_TITLE: ${{ inputs.pr_title }}
          PR_BODY: ${{ inputs.pr_body }}
          PR_NUMBER: ${{ inputs.pr_number }}
          PR_URL: ${{ inputs.pr_url }}
          GITHUB_TOKEN: ${{ secrets.token }}
          GITHUB_REPO: ${{ github.repository }}
          BASE_SHA: ${{ inputs.base_sha }}
          # Absolute paths resolved from the workflow workspace.
          TOOLS_DIR: ${{ github.workspace }}/main-tools
          BASE_DIR: ${{ github.workspace }}/base
          # Pinned so no checkout can influence which prettier runs.
          PRETTIER_VERSION: 3.10.1
        run: |
          set -euo pipefail

          PR_AUTHOR=$(gh api "repos/${GITHUB_REPO}/pulls/${PR_NUMBER}" --jq '.user.login')

          if [ -n "$PR_BODY" ]; then
            commit_msg=$(printf '%s\n\n%s\n\nPR-Number: %s\nPR-Url: %s\nPR-Author: %s' "$PR_TITLE" "$PR_BODY" "$PR_NUMBER" "$PR_URL" "$PR_AUTHOR")
          else
            commit_msg=$(printf '%s\n\nPR-Number: %s\nPR-Url: %s\nPR-Author: %s' "$PR_TITLE" "$PR_NUMBER" "$PR_URL" "$PR_AUTHOR")
          fi

          # Pin git-cliff to the trusted config from main so a fork-supplied
          # cliff.toml (which can run arbitrary commands via postprocessors) is
          # never used.
          cliff_config="${TOOLS_DIR}/cliff.toml"

          # CHANGELOG.md — generated into the base_sha checkout. The scripts are
          # the ones from main (TOOLS_DIR); --repo-dir points them at the base
          # repo so history is read there and CHANGELOG.md is written there.
          COMMIT_MSG="${commit_msg}" \
          "${TOOLS_DIR}/hack/update_changelog.sh" \
            --repo-dir "${BASE_DIR}" \
            --config "${cliff_config}" \
            --base-commit "${BASE_SHA}"

          # VERSION.yaml (and the chart version) — same tools, same base repo,
          # same range endpoint, and the SAME injected PR virtual commit
          # (COMMIT_MSG) so the version bump reflects the incoming PR too
          # (feat -> minor, breaking -> major) and stays consistent with the
          # changelog entry generated above.
          COMMIT_MSG="${commit_msg}" \
          "${TOOLS_DIR}/hack/update_version.sh" \
            --repo-dir "${BASE_DIR}" \
            --config "${cliff_config}" \
            --base-commit "${BASE_SHA}"

          # Format only the generated changelog using prettier. We must not let
          # any checkout influence which prettier (or which plugins/config)
          # runs, so we:
          #   * pin an exact prettier version (no checkout-controlled range),
          #   * invoke npx from the TOOLS dir so a fork-supplied
          #     node_modules/package.json cannot shadow the install,
          #   * disable config discovery (--no-config) so no fork .prettierrc
          #     can load plugins or alter behavior (Prettier 3 only loads
          #     plugins when a config or --plugin asks for them),
          #   * pass the CHANGELOG by absolute path and pin all flags.
          ( cd "${TOOLS_DIR}" \
            && npx --yes "prettier@${PRETTIER_VERSION}" \
                 --no-config \
                 --prose-wrap always \
                 --write "${BASE_DIR}/CHANGELOG.md" )

      # 5) Commit the generated CHANGELOG.md and VERSION.yaml to the PR branch.
      # We copy ONLY those two files from the base checkout into the untrusted
      # PR-branch checkout and commit them there. This guarantees the pushed
      # delta is exactly the two files on top of the PR-branch tip — no base
      # tree, no merge commit, nothing under .github/workflows/** — so the
      # default GITHUB_TOKEN (which cannot push workflow-file changes) suffices.
      - name: Commit CHANGELOG.md and VERSION.yaml to the PR branch
        working-directory: branch
        env:
          BASE_DIR: ${{ github.workspace }}/base
          GITHUB_HEAD_REF_LOCAL: ${{ inputs.head_ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Overlay ONLY the two generated files from the base checkout onto the
          # PR branch working tree.
          cp "${BASE_DIR}/CHANGELOG.md" CHANGELOG.md
          cp "${BASE_DIR}/VERSION.yaml" VERSION.yaml

          # Stage ONLY the two files this workflow is ever allowed to change.
          git add CHANGELOG.md VERSION.yaml

          # Hard guard: abort if anything other than CHANGELOG.md / VERSION.yaml
          # is staged. This workflow must NEVER add or update any other file
          # (in particular nothing under .github/workflows/**, which the default
          # GITHUB_TOKEN cannot push). `git add` with explicit paths already
          # limits what is staged, but we verify the staged set defensively so a
          # future change (or an unexpected working-tree state) can never sneak
          # extra files into the pushed commit.
          staged=$(git diff --cached --name-only)
          allowed=$'CHANGELOG.md\nVERSION.yaml'
          unexpected=$(comm -23 \
            <(printf '%s\n' "$staged" | sed '/^$/d' | sort -u) \
            <(printf '%s\n' "$allowed" | sort -u))
          if [ -n "$unexpected" ]; then
            echo "error: refusing to commit unexpected files:" >&2
            printf '  %s\n' $unexpected >&2
            echo "only CHANGELOG.md and VERSION.yaml may be committed by this workflow" >&2
            exit 1
          fi

          # Nothing staged means nothing changed — that is fine, just skip.
          git diff --cached --quiet && exit 0

          git commit --signoff -m "chore: update CHANGELOG.md and VERSION.yaml [skip ci]"

          # Push exactly this one commit onto the remote PR branch. The local
          # branch differs from the remote only by this single changelog/version
          # commit (we never merged anything in), so pushing the ref explicitly
          # carries exactly that delta.
          git push origin "HEAD:${GITHUB_HEAD_REF_LOCAL}"
