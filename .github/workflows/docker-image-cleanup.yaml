name: Daily Image Cleanup
on:
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:
jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      # dataaxiom/ghcr-cleanup-action is not a verified Marketplace creator, so
      # the cleanup is driven directly via the GitHub REST API (gh) instead.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (v7)
      - name: Delete PR and untagged images
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          hack/ghcr_cleanup.sh \
            --owner cloudoperators \
            --package rootstock \
            --delete-tag-glob 'pr-*' \
            --delete-untagged
