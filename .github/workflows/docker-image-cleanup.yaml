name: Daily Image Cleanup
on:
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:
jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          owner: cloudoperators
          package: rootstock
          delete-tags: 'pr-*'
          delete-untagged: true