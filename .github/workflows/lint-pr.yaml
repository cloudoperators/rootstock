name: 'Lint PR'

on:
  pull_request:
    types:
      - opened
      - reopened
      - edited
      - synchronize

jobs:
  main:
    name: Validate PR title
    runs-on: ubuntu-slim
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@66e72920af32222769c386d81f89656ebcb6d6d5 # v6.1.4 (v6)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Configure which types are allowed (newline-delimited).
          # These are regex patterns auto-wrapped in `^ $`.
          # Default: https://github.com/commitizen/conventional-commit-types
          ##
          # fix   : all changes that address a failure of the current code base must be prefixed with this
          # feat  : all changes that add business functionality (features) to the current code base must be prefixed with this
          # docs  : all changes to the documentation (internal and external) must be prefixed with this
          # chore : all other changes (e.g. to scripts, internal tooling) must be prefixed with this
          types: |
            fix 
            feat
            docs
            chore