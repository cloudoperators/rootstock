name: 'Lint PR'

on:
  pull_request:
    types:
      - opened
      - reopened
      - edited
      - synchronize

jobs:
  main:
    name: Validate PR title
    runs-on: ubuntu-slim
    permissions:
      pull-requests: read
    steps:
      # amannn/action-semantic-pull-request is not a verified Marketplace
      # creator, so validate the PR title with a self-contained script instead.
      #
      # Allowed types:
      #   fix   : all changes that address a failure of the current code base
      #   feat  : all changes that add business functionality (features)
      #   docs  : all changes to the documentation (internal and external)
      #   chore : all other changes (e.g. to scripts, internal tooling)
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (v7)
      - name: Validate PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          hack/lint_pr_title.sh --types "fix feat docs chore"