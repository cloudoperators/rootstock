name: Label Issue

on:
  issues:
    types: [opened, edited]

permissions: {}

jobs:
  label-priority:
    runs-on: ubuntu-slim
    if: contains(github.event.issue.labels.*.name, 'enhancement')
    permissions:
      issues: write
    steps:
      - name: Extract priority and apply label
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0 (v7)
        with:
          script: |
            const body = context.payload.issue.body ?? '';

            const priorityMap = {
              "(Low) Something is a little off": 'priority: low',
              "(Medium) I'm annoyed but I'll live": 'priority: medium',
              "(Urgent) I can't use the rootstock without": 'priority: high',
            };

            const matched = Object.entries(priorityMap).find(([key]) =>
              body.includes(key)
            );

            if (!matched) return;

            const [, label] = matched;

            // Remove any existing priority labels before adding the new one
            const existingLabels = context.payload.issue.labels.map(l => l.name);
            const priorityLabels = Object.values(priorityMap);
            const toRemove = existingLabels.filter(l => priorityLabels.includes(l) && l !== label);

            await Promise.all(toRemove.map(name =>
              github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                name,
              }).catch(() => {})
            ));

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: [label],
            });
