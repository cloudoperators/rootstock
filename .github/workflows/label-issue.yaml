name: LabelIssue
on:
  issues:
    types: [opened]

jobs:
  label:
    runs-on: ubuntu-slim
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body ?? '';
            const match = body.match(/###\s*Priority\s*\n+\((\w+)\)/);
            if (!match) return;

            const levelMap = {
              Low: { name: 'priority: low', color: '0075ca' },
              Medium: { name: 'priority: medium', color: 'e4e669' },
              Urgent: { name: 'priority: high', color: 'd73a4a' },
            };
            const level = match[1];
            const labelDef = levelMap[level];
            if (!labelDef) return;

            # // Create label if it doesn't exist yet
            # try {
            #   await github.rest.issues.createLabel({
            #     owner: context.repo.owner,
            #     repo: context.repo.repo,
            #     name: labelDef.name,
            #     color: labelDef.color,
            #   });
            # } catch (e) {
            #   if (e.status !== 422) throw e; // 422 = already exists
            # }

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: [labelDef.name],
            });