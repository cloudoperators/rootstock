name: CI

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  variables:
    name: Variables
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (v7)
      - name: Get version from VERSION.yaml
        id: version
        run: |
          version=$(make get-version)
          echo "version: $version"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

  conventions:
    name: Conventions
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0 (v2)
        id: app-token
        with:
          app-id: ${{ secrets.CLOUDOPERATOR_APP_ID }}
          private-key: ${{ secrets.CLOUDOPERATOR_APP_PRIVATE_KEY }}
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (v7)
        with:
          ref: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.head_ref || github.ref }}
          token: ${{ steps.app-token.outputs.token }}
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0 (v5)
        with:
          go-version-file: go.mod
          cache: true
      - name: Install golangci-lint
        env:
          GOLANGCI_LINT_VERSION: v2.14.0
        run: |
          # The golangci/golangci-lint-action is not a verified Marketplace
          # creator, so install the binary directly via the official script.
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh \
            | sh -s -- -b "$(go env GOPATH)/bin" "$GOLANGCI_LINT_VERSION"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Run lint-go
        run: make lint-go
      - name: Install prettier
        run: npm install -g prettier
      - name: Lint Markdown
        run: make lint-md
      - name: Lint Shell
        run: make lint-shell
      - name: Lint helm
        run: make lint-helm
      - name: Commit auto-fixes
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git commit -am "chore: apply linter auto-fixes"
            git push
          fi

  unit-tests:
    name: Unit Tests
    permissions:
      contents: read
    uses: cloudoperators/common/.github/workflows/shared-go-test.yaml@main
    with:
      test-target: test-unit
      upload-coverage: true
      coverage-artifact-name: code-coverage
      coverage-path: coverage.out
  code_coverage:
    name: Code coverage report
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: [unit-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (v7)
        with:
          persist-credentials: true
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0 (v5)
        with:
          go-version-file: go.mod
          cache: true
      - name: Post coverage report
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          make coverage-report
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: write

  build:
    permissions:
      contents: read
      packages: write
      # This is used to complete the identity challenge
      # with sigstore/fulcio when running outside of PRs.
      id-token: write
      security-events: write
    secrets: inherit
    uses: ./.github/workflows/docker-build.yaml
    needs: [variables]
    with:
      version: ${{ needs.variables.outputs.version }}-pr-${{ github.event.number }}

  contract-tests:
    name: Contract Tests
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (v7)
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0 (v5)
        with:
          go-version-file: go.mod
      - name: Run contract tests
        run: make test-contract

  file-generation:
    name: File Generation
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (v7)
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0 (v5)
        with:
          go-version-file: go.mod
      - name: Run file generation
        run: make generate
