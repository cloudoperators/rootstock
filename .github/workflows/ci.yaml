name: CI

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true


jobs:
  variables:
    name: Variables
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.result }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Get version from VERSION.yaml
        id: version
        run: |
          version=$(make get-version)
          echo "version: $version"
          echo "VERSION=${version}" >> "$GITHUB_OUTPUT"

  conventions:
    name: Conventions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
      - name: TODO - Markdown linting
        run: echo "TODO - run prettier on markdown files"
      - name: TODO - Shell linting
        run: echo "TODO - run shellcheck on shell scripts"

  code-scans:
    name: Code Scans
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Run code scans
        run: make scan

  unit-tests:
    name: Unit Tests
    uses: cloudoperators/common/.github/workflows/shared-go-test.yaml@main
    with:
      test-target: test-unit

  build:
    permissions:
      contents: read
      packages: write
      # This is used to complete the identity challenge
      # with sigstore/fulcio when running outside of PRs.
      id-token: write
      security-events: write
    secrets: inherit
    uses: ./.github/workflows/docker-build.yaml
    needs:
      - variables
    with:
      version: ${{ needs.variables.outputs.version }}-pr-${{ github.event.number }}

  contract-tests:
    name: Contract Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Run contract tests
        run: make test-contract

  file-generation:
    name: File Generation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Run file generation
        run: make generate
