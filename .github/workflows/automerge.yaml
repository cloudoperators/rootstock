name: Automerge

on:
  workflow_run:
    workflows: ["CI", "REUSE Compliance Check", "CodeQL"]
    types: [completed]
  pull_request_review:
    types: [submitted]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to merge
        required: true
        type: string
      debug:
        description: enable for debug output
        required: false
        default: True
        type: boolean

env:
  TARGET_BRANCH: main
  BLOCKED_LABELS: "invalid,WIP,wip,do-not-merge,DO-NOT-MERGE"
  DEBUG: ${{ inputs.debug || vars.DEBUG || 'false' }}

permissions:
  contents: write
  pull-requests: write

jobs:
  check-eligibility:
    runs-on: ubuntu-latest
    outputs:
      eligible: ${{ steps.check.outputs.eligible }}
      pr_number: ${{ steps.check.outputs.pr_number }}
      pr_title: ${{ steps.check.outputs.pr_title }}
      pr_body: ${{ steps.check.outputs.pr_body }}
      pr_url: ${{ steps.check.outputs.pr_url }}
      head_ref: ${{ steps.check.outputs.head_ref }}
      base_sha: ${{ steps.check.outputs.base_sha }}
    steps:
      - name: Check PR eligibility
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_PR: ${{ inputs.pr_number }}
          REVIEW_PR: ${{ github.event.pull_request.number }}
          WORKFLOW_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WORKFLOW_PRS: ${{ toJson(github.event.workflow_run.pull_requests) }}
        run: |
          # ---------------------------------------------------------------------------
          # main
          # ---------------------------------------------------------------------------
          main() {
            local pr_number
            pr_number=$(resolve_pr_number)

            if [ -z "$pr_number" ]; then
              echo "DEBUG: PR_NUMBER is empty - aborting"
              echo "eligible=false" >> "$GITHUB_OUTPUT"
              return
            fi

            fetch_pr "$pr_number"
            fetch_reviews "$pr_number"

            if check_eligibility; then
              emit_outputs
            else
              echo "eligible=false" >> "$GITHUB_OUTPUT"
            fi
          }

          # ---------------------------------------------------------------------------
          # resolve_pr_number: returns the PR number for the current trigger event
          # ---------------------------------------------------------------------------
          resolve_pr_number() {
            case "$EVENT_NAME" in
              workflow_dispatch)   echo "$DISPATCH_PR" ;;
              pull_request_review) echo "$REVIEW_PR" ;;
              workflow_run)
                echo "$WORKFLOW_PRS" \
                  | jq -r 'if length > 0 then .[0].number else empty end'
                ;;
            esac
          }

          # ---------------------------------------------------------------------------
          # fetch_pr <pr_number>: populates globals PR and PR_BODY
          # ---------------------------------------------------------------------------
          fetch_pr() {
            local pr_number="$1"
            PR=$(gh pr view "$pr_number" --repo "$GITHUB_REPOSITORY" \
              --json number,title,headRefName,baseRefName,baseRefOid,mergeStateStatus,url,isDraft,labels,reviewRequests)
            PR_BODY=$(gh pr view "$pr_number" --repo "$GITHUB_REPOSITORY" \
              --json body | jq -r '.body // ""')
          }

          # ---------------------------------------------------------------------------
          # fetch_reviews <pr_number>: populates global REVIEWS as [{login, state}],
          # keeping only the latest review per reviewer
          # ---------------------------------------------------------------------------
          fetch_reviews() {
            local pr_number="$1"
            REVIEWS=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}/reviews" \
              --paginate \
              --jq 'group_by(.user.login) | map(max_by(.submitted_at)) | map({login: .user.login, state})')
          }

          # ---------------------------------------------------------------------------
          # has_codeowner_approved: returns 0 if a codeowner's latest review is APPROVED
          # Reads individual @users and @org/teams from .github/CODEOWNERS
          # ---------------------------------------------------------------------------
          has_codeowner_approved() {
            local codeowners_raw teams users approved_logins login team org slug

            codeowners_raw=$(gh api "repos/${GITHUB_REPOSITORY}/contents/.github/CODEOWNERS" \
              --jq '.content' | base64 -d)
            teams=$(printf '%s' "$codeowners_raw" \
              | grep -v '^#' | grep -v '^[[:space:]]*$' \
              | grep -oE '@[a-zA-Z0-9_.-]+/[a-zA-Z0-9_.-]+' | sed 's/@//')
            users=$(printf '%s' "$codeowners_raw" \
              | grep -v '^#' | grep -v '^[[:space:]]*$' \
              | grep -oE '@[a-zA-Z0-9_.-]+' | grep -v '/' | sed 's/@//')

            approved_logins=$(echo "$REVIEWS" \
              | jq -r '[.[] | select(.state == "APPROVED") | .login] | .[]')

            for login in $approved_logins; do
              if printf '%s\n' "$users" | grep -qx "$login"; then
                return 0
              fi
              for team in $teams; do
                org="${team%%/*}"
                slug="${team##*/}"
                if gh api "orgs/${org}/teams/${slug}/memberships/${login}" \
                    --silent >/dev/null 2>&1; then
                  return 0
                fi
              done
            done
            return 1
          }

          # ---------------------------------------------------------------------------
          # check_eligibility: evaluates all conditions and returns 0 (eligible) or 1 (not)
          # ---------------------------------------------------------------------------
          check_eligibility() {
            local base state draft blocked_label pending_reviews changes_requested codeowner_approved

            base=$(echo "$PR" | jq -r .baseRefName)
            state=$(echo "$PR" | jq -r .mergeStateStatus)
            draft=$(echo "$PR" | jq -r .isDraft)
            blocked_label=$(echo "$PR" | jq -r --arg bl "$BLOCKED_LABELS" '
              ($bl | split(",")) as $list | .labels[].name | select(IN($list[]))
            ' | head -1)
            pending_reviews=$(echo "$PR" | jq -r '
              [.reviewRequests[].requestedReviewer.login
                | select(test("copilot"; "i") | not)] | length')
            changes_requested=$(echo "$REVIEWS" \
              | jq '[.[] | select(.state == "CHANGES_REQUESTED")] | length')

            if has_codeowner_approved; then codeowner_approved="true"
            else                            codeowner_approved="false"
            fi

            eligible="true"

            if [ "$base" != "$TARGET_BRANCH" ] \
              || [ "$state" != "CLEAN" ] \
              || [ "$changes_requested" -gt 0 ] \
              || [ "$codeowner_approved" != "true" ] \
              || [ "$pending_reviews" -gt 0 ] \
              || [ "$draft" = "true" ] \
              || [ -n "$blocked_label" ]; then
              eligible="false"
            fi

            debug_eligibility "$eligible" "$base" "$state" "$changes_requested" \
              "$codeowner_approved" "$pending_reviews" "$draft" "$blocked_label"
            
            if [[ "$eligible"=="true" ]]; then
              return 0
            else
              return 1
            fi
          }

          # ---------------------------------------------------------------------------
          # debug_eligibility <eligible> <base> <state> <changes_requested>
          #                   <codeowner_approved> <pending_reviews> <draft> <blocked_label>
          # Prints all eligibility conditions; no-ops when DEBUG != true
          # ---------------------------------------------------------------------------
          debug_eligibility() {
            [ "$DEBUG" != "true" ] && return
            local eligible="$1" base="$2" state="$3" changes_requested="$4" \
                  codeowner_approved="$5" pending_reviews="$6" draft="$7" blocked_label="$8"

            echo "DEBUG: eligible=$eligible"
            echo "DEBUG: pr_number=$(echo "$PR" | jq -r .number)"
            if [ "$eligible" = "true" ]; then
              echo "DEBUG: pr_title=$(echo "$PR" | jq -r .title)"
              echo "DEBUG: pr_url=$(echo "$PR" | jq -r .url)"
              echo "DEBUG: head_ref=$(echo "$PR" | jq -r .headRefName)"
              echo "DEBUG: base_sha=$(echo "$PR" | jq -r .baseRefOid)"
            fi
            echo "DEBUG: base=$base ?= $TARGET_BRANCH"
            echo "DEBUG: merge_state_status=$state ?= NOT CLEAN"
            echo "DEBUG: changes_requested=$changes_requested ?= 0"
            echo "DEBUG: codeowner_approved=$codeowner_approved ?= true"
            echo "DEBUG: pending_reviews=$pending_reviews ?= 0"
            echo "DEBUG: is_draft=$draft ?= true"
            echo "DEBUG: blocked_label=${blocked_label:-<none>}"
            echo "DEBUG: pr_body=$PR_BODY"
          }

          # ---------------------------------------------------------------------------
          # emit_outputs: writes eligible=true and all PR fields to GITHUB_OUTPUT
          # ---------------------------------------------------------------------------
          emit_outputs() {
            {
              echo "eligible=true"
              echo "pr_number=$(echo "$PR" | jq -r .number)"
              echo "pr_title=$(echo "$PR" | jq -r .title)"
              echo "pr_url=$(echo "$PR" | jq -r .url)"
              echo "head_ref=$(echo "$PR" | jq -r .headRefName)"
              echo "base_sha=$(echo "$PR" | jq -r .baseRefOid)"
              printf 'pr_body<<__BODY__\n'
              printf '%s\n' "$PR_BODY"
              printf '__BODY__\n'
            } >> "$GITHUB_OUTPUT"
          }

          main

  update-changelog-and-version:
    needs: check-eligibility
    if: needs.check-eligibility.outputs.eligible == 'true'
    uses: ./.github/workflows/changelog_version.yaml
    with:
      head_ref: ${{ needs.check-eligibility.outputs.head_ref }}
      pr_number: ${{ needs.check-eligibility.outputs.pr_number }}
      pr_title: ${{ needs.check-eligibility.outputs.pr_title }}
      pr_body: ${{ needs.check-eligibility.outputs.pr_body }}
      pr_url: ${{ needs.check-eligibility.outputs.pr_url }}
      base_sha: ${{ needs.check-eligibility.outputs.base_sha }}
    secrets: inherit


  merge:
    needs: [check-eligibility, update-changelog-and-version]
    if: needs.check-eligibility.outputs.eligible == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ secrets.CLOUDOPERATOR_APP_ID }}
          private-key: ${{ secrets.CLOUDOPERATOR_APP_PRIVATE_KEY }}
      - name: Merge PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh pr merge "${{ needs.check-eligibility.outputs.pr_number }}" \
            --repo "$GITHUB_REPOSITORY" \
            --squash \
            --delete-branch
