name: Automerge

on:
  workflow_run:
    workflows: ["CI", "REUSE Compliance Check", "CodeQL"]
    types: [completed]
  pull_request_review:
    types: [submitted]
  pull_request:
    types: [review_requested, review_request_removed]
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to merge
        required: true
        type: string
      debug:
        description: enable for debug output
        required: false
        default: True
        type: boolean

env:
  TARGET_BRANCH: main
  BLOCKED_LABELS: "invalid,WIP,wip,do-not-merge,DO-NOT-MERGE"

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
    steps:
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ secrets.CLOUDOPERATOR_APP_ID }}
          private-key: ${{ secrets.CLOUDOPERATOR_APP_PRIVATE_KEY }}
      - name: Break off if another automerge is running or main has active workflows
        id: check
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          jq_filter='(env.CURRENT_RUN_ID | tonumber) as $cur | [.[] | select(.databaseId != $cur)] | length'
          running=$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow=automerge.yaml \
            --status=in_progress \
            --json databaseId \
            --jq "$jq_filter"
          )
          if [ "$running" -gt 0 ]; then
            echo "Another automerge run is already in progress — breaking off"
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          main_sha=$(
            gh api "repos/${GITHUB_REPOSITORY}/git/refs/heads/main" --jq '.object.sha'
          )
          jq_filter='(env.CURRENT_RUN_ID | tonumber) as $cur
            | [.workflow_runs[]
            | select(.id != $cur)
            | select(.name != "Automerge")
            | select(.status != "completed")]
            | length'
          running_on_main=$(
            gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${main_sha}" \
            --jq "$jq_filter"
          )
          if [ "$running_on_main" -gt 0 ]; then
            echo "Workflows are running on HEAD of main (${main_sha}) — breaking off"
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "proceed=true" >> "$GITHUB_OUTPUT"

  check-eligibility:
    needs: guard
    if: needs.guard.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    outputs:
      eligible: ${{ steps.check.outputs.eligible }}
      pr_number: ${{ steps.check.outputs.pr_number }}
      pr_title: ${{ steps.check.outputs.pr_title }}
      pr_body: ${{ steps.check.outputs.pr_body }}
      pr_url: ${{ steps.check.outputs.pr_url }}
      head_ref: ${{ steps.check.outputs.head_ref }}
      base_sha: ${{ steps.check.outputs.base_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TARGET_BRANCH }}
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ secrets.CLOUDOPERATOR_APP_ID }}
          private-key: ${{ secrets.CLOUDOPERATOR_APP_PRIVATE_KEY }}
      - name: Resolve PR number
        id: resolve
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_PR: ${{ inputs.pr_number }}
          REVIEW_PR: ${{ github.event.pull_request.number }}
          WORKFLOW_PRS: ${{ toJson(github.event.workflow_run.pull_requests) }}
        run: |
          case "$EVENT_NAME" in
            workflow_dispatch)
              pr_number="$DISPATCH_PR"
              ;;
            pull_request_review|pull_request)
              pr_number="$REVIEW_PR"
              ;;
            workflow_run)
              pr_number=$(echo "$WORKFLOW_PRS" \
                | jq -r 'if length > 0 then .[0].number else empty end')
              ;;
            schedule)
              pr_nums=$(
                 gh api --paginate \
                   "repos/${GITHUB_REPOSITORY}/pulls?state=open&base=${TARGET_BRANCH}&per_page=100" \
                   --jq '.[].number'
              )
              for pr_num in $pr_nums; do
                output=$(
                  PRINT=true PR_NUMBER="$pr_num" \
                  hack/automerge_check.sh 2>/dev/null || true
                )
                if echo "$output" | grep -q "^eligible=true"; then
                  pr_number="$pr_num"
                  break
                fi
              done
              ;;
          esac
          echo "pr_number=${pr_number:-}" >> "$GITHUB_OUTPUT"
      - name: Check PR eligibility
        id: check
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ steps.resolve.outputs.pr_number }}
          DEBUG: ${{ inputs.debug || vars.DEBUG || 'false' }}
        run: make automerge-check

  update-changelog-and-version:
    needs: check-eligibility
    if: needs.check-eligibility.outputs.eligible == 'true'
    uses: ./.github/workflows/changelog_version.yaml
    with:
      head_ref: ${{ needs.check-eligibility.outputs.head_ref }}
      pr_number: ${{ needs.check-eligibility.outputs.pr_number }}
      pr_title: ${{ needs.check-eligibility.outputs.pr_title }}
      pr_body: ${{ needs.check-eligibility.outputs.pr_body }}
      pr_url: ${{ needs.check-eligibility.outputs.pr_url }}
      base_sha: ${{ needs.check-eligibility.outputs.base_sha }}
    secrets: inherit


  merge:
    needs: [check-eligibility, update-changelog-and-version]
    if: needs.check-eligibility.outputs.eligible == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ secrets.CLOUDOPERATOR_APP_ID }}
          private-key: ${{ secrets.CLOUDOPERATOR_APP_PRIVATE_KEY }}
      - name: Merge PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ needs.check-eligibility.outputs.pr_number }}
        run: |
          gh pr merge "${{ needs.check-eligibility.outputs.pr_number }}" \
            --repo "$GITHUB_REPOSITORY" \
            --squash \
            --delete-branch
