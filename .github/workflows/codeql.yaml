name: CodeQL
on:
  push:
    branches: [ "main" ]
  pull_request:
    types: [ opened, synchronize, reopened ]
  schedule:
    - cron: '20 08 * * 1'

permissions: {}

jobs:
  codeql:
    permissions:
      security-events: write
      actions: read
      contents: read
    uses: cloudoperators/common/.github/workflows/shared-codeql.yaml@9cb36139de44212c098042fa6a9a0b3e811b2b63 # main
    with:
      runs-on: "['ubuntu-latest']"
      language: "['go', 'actions']"
      go-check: true
      go-version: "['1.27']"
      node-check: false
      # node-version : "['node']"
      # fail-fast: false
      # timeout: 30
      autobuild: true
      # build_query: "make something"
