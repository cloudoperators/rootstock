apiVersion: apps/v1
kind: Deployment
metadata:
  name: redfish-mockup
  labels:
    app: redfish-mockup
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redfish-mockup
  template:
    metadata:
      labels:
        app: redfish-mockup
    spec:
      containers:
        - name: redfish-mockup
          image: rootstock-mockup:latest
          imagePullPolicy: IfNotPresent
          # Image is built from hack/kind/Dockerfile.mockup with the PDU dataset
          # baked in; it serves rootstock's testdata/pdu-mockup on :8000.
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /redfish/v1/PowerEquipment
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: redfish-mockup
  labels:
    app: redfish-mockup
spec:
  selector:
    app: redfish-mockup
  ports:
    - port: 8000
      targetPort: 8000
      protocol: TCP
