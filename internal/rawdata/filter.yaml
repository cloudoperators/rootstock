filters:
  redfish:
    Panduit1:
      "/redfish/v1/PowerEquipment/RackPDUs/1/Sensors/PDUPower":
        keys:
          .Reading:
            newKey: "power"                     # metrics final name
            labels:
              unit: .ReadingUnits                      # constant
              uri: ."@odata.id"
              id: .Id  # json reference
              state: .Status.State
              health: .Status.Health
          .ApparentVA:
            newKey: "apparentVA"                     # metrics final name
            labels:
              unit: "VA"                      # constant
              uri: ."@odata.id"
              id: .Id  # json reference
              state: .Status.State
              health: .Status.Health
          .ReactiveVAR:
            newKey: "reactiveVAR"                     # metrics final name
            labels:
              unit: "VAR"                      # constant
              uri: ."@odata.id"
              id: .Id  # json reference
              state: .Status.State
              health: .Status.Health
