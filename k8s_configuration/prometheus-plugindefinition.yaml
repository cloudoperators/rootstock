# Greenhouse PluginDefinition for Prometheus monitoring stack.
#
# This wraps the kube-prometheus-stack Helm chart with custom scrape configurations
# optimized for monitoring rootstock Redfish exporters using the multi-target probe pattern.
apiVersion: greenhouse.sap/v1alpha1
kind: PluginDefinition
metadata:
  name: prometheus-monitoring
  namespace: demo
spec:
  version: 65.1.1
  displayName: Prometheus Monitoring Stack
  description: >-
    Complete Prometheus monitoring stack including Prometheus Operator, Grafana,
    Alertmanager, and various exporters. Pre-configured with scrape jobs for
    rootstock Redfish probe endpoints using the multi-target exporter pattern.
  helmChart:
    name: kube-prometheus-stack
    repository: https://prometheus-community.github.io/helm-charts
    version: 65.1.1
  options:
    # Prometheus configuration
    - name: prometheus.enabled
      displayName: Enable Prometheus
      description: Deploy Prometheus server
      type: bool
      required: false
      default: true

    - name: prometheus.prometheusSpec.replicas
      displayName: Prometheus Replicas
      description: Number of Prometheus server replicas
      type: int
      required: false
      default: 1

    - name: prometheus.prometheusSpec.retention
      displayName: Metrics Retention
      description: Duration to retain metrics (e.g., 30d, 6h)
      type: string
      required: false
      default: "30d"

    - name: prometheus.prometheusSpec.storageSpec.volumeClaimTemplate.spec.resources.requests.storage
      displayName: Storage Size
      description: Size of persistent volume for Prometheus metrics storage
      type: string
      required: false
      default: "50Gi"

    # Rootstock scrape configuration
    - name: prometheus.prometheusSpec.additionalScrapeConfigs
      displayName: Additional Scrape Configs
      description: >-
        Custom Prometheus scrape configurations for rootstock targets.
        Configures the multi-target probe pattern for Redfish endpoints.
      type: string
      required: false
