# Greenhouse PluginDefinition for rootstock.
#
# This wraps the Helm chart in k8s_configuration/chart. The helmChart reference
# below points at a published chart; update repository/version to match your
# release (e.g. an OCI registry such as oci://ghcr.io/cloudoperators/charts).
#
apiVersion: greenhouse.sap/v1alpha1
kind: PluginDefinition
metadata:
  name: rootstock
spec:
  version: 0.1.0
  displayName: rootstock
  description: >-
    Data-center energy/carbon telemetry collector. Scrapes Redfish targets and
    exposes Prometheus metrics using a multi-target probe pattern.
  helmChart:
    name: rootstock
    repository: oci://ghcr.io/cloudoperators/rootstock/charts
    version: 0.1.0
  options:
    - name: image.repository
      description: Container image repository for rootstock.
      type: string
      required: false
      default: "ghcr.io/cloudoperators/rootstock"
    - name: image.tag
      description: Container image tag. Defaults to the chart version when empty.
      type: string
      required: false
    - name: image.pullPolicy
      description: Kubernetes image pull policy for rootstock.
      type: string
      required: false
      default: IfNotPresent
    - name: rootstock.redfish.existingSecret
      description: Kubernetes image pull policy for rootstock.
      type: string
      required: false
      default: IfNotPresent
    - name: serviceMonitor.enabled
      displayName: Enable ServiceMonitor
      description: Create a Prometheus Operator ServiceMonitor for /metrics.
      type: bool
      required: false
      default: false
    - name: snmpExporter.enabled
      displayName: Enable SNMP Exporter sidecar
      description: >-
        Deploy SNMP exporter as a sidecar container for monitoring network
        devices via SNMP. Exposes port 9116 with /snmp endpoint.
      type: bool
      required: false
      default: false
