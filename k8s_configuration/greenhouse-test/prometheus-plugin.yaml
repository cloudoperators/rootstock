# Greenhouse Plugin CR for deploying Prometheus monitoring stack.
#
# This deploys the kube-prometheus-stack with custom scrape configurations
# for monitoring rootstock Redfish exporters in the test environment.
apiVersion: greenhouse.sap/v1alpha1
kind: Plugin
metadata:
  name: prometheus-monitoring
  namespace: demo
spec:
  pluginDefinitionRef:
    kind: PluginDefinition
    name: prometheus-monitoring
  clusterName: kind-greenhouse-remote
  releaseNamespace: monitoring
  optionValues:
    - name: prometheus.enabled
      value: true
    - name: prometheus.prometheusSpec.replicas
      value: 1
    - name: prometheus.prometheusSpec.retention
      value: "7d"
    - name: prometheus.prometheusSpec.storageSpec.volumeClaimTemplate.spec.resources.requests.storage
      value: "10Gi"
    - name: prometheus.prometheusSpec.additionalScrapeConfigs
      value: |
        - job_name: 'rootstock-probe'
          scrape_interval: 30s
          scrape_timeout: 25s
          metrics_path: /probe
          static_configs:
            - targets:
                - http://redfish-mockup.rootstock.svc.cluster.local:8000
              labels:
                pdu_id: "1"
            - targets:
                - http://redfish-mockup.rootstock.svc.cluster.local:8000
              labels:
                pdu_id: "2"
          relabel_configs:
            - source_labels: [__address__]
              target_label: __param_target
            - source_labels: [pdu_id]
              target_label: __param_labels
            - target_label: __address__
              replacement: rootstock.rootstock.svc.cluster.local:9220
            - source_labels: [__param_target]
              target_label: instance
            - source_labels: [pdu_id]
              target_label: pdu_id
        - job_name: 'rootstock-metrics'
          scrape_interval: 30s
          metrics_path: /metrics
          static_configs:
            - targets:
                - rootstock.rootstock.svc.cluster.local:9220
    - name: grafana.enabled
      value: true
    - name: alertmanager.enabled
      value: true
    - name: nodeExporter.enabled
      value: true
    - name: kubeStateMetrics.enabled
      value: true
    - name: prometheus.service.type
      value: "ClusterIP"
