# Pre-created Secret holding the Redfish password. The Plugin's
# redfish.password option references this via valueFrom.secret{name,key}.
# Create it in the SAME namespace as the Plugin (the Organization namespace),
# because that is where Greenhouse resolves valueFrom.secret references.
#
# Replace the password before applying, or create it imperatively:
#   kubectl create secret generic rootstock-redfish \
#     --from-literal=redfish_password='CHANGEME' -n PLACEHOLDER_ORG_NAMESPACE
apiVersion: v1
kind: Secret
metadata:
  name: rootstock-redfish
  namespace: PLACEHOLDER_ORG_NAMESPACE
type: Opaque
stringData:
  redfish_pdus.yaml: |
    pdu1: {username: redfish, password: changeThis}
