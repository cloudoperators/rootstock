# Default values for the rootstock chart.

# Override the namespace this chart deploys into. When empty the Helm release
# namespace is used (the default --namespace / -n flag passed to helm install).
namespace: ""

# Override the release name used to derive resource names and labels. When empty
# the Helm release name (.Release.Name) is used.
releaseName: ""

# Number of rootstock replicas. rootstock is a stateless multi-target probe
# exporter, so it can be scaled horizontally if needed.
replicaCount: 1
image:
  # Container image repository for rootstock.
  repository: ghcr.io/cloudoperators/rootstock
  # Image tag. Defaults to the chart appVersion when left empty.
  tag: ""
  # Image digest. Takes precedence over tag when set (e.g. sha256:...).
  digest: ""
  pullPolicy: IfNotPresent

rootstock:
  log:
    level: debug
    format: text
    trace: false
  redfish:
    username: redfish
    # The password is ALWAYS consumed from a mounted file, never an environment
    # variable. There are two mutually exclusive ways to supply it:
    #
    # 1. existingSecret: reference a pre-created, externally-managed Kubernetes
    #    Secret (recommended when the Secret is managed outside the chart). The
    #    secret content must have the format
    #
    #     redfish_pdus.yaml: |
    #       pdu1:
    #         password: password_value
    #         username: user_value
    #
    # 2. password: provide the value inline and let the chart render a Secret.
    #    Used for self-contained / local (kind) deployments AND by Greenhouse:
    #    a Plugin's redfish.password (valueFrom.secret) feeds this value.
    #
    # In both cases the Secret is projected into the pod as a read-only file.
    existingSecret: ""
    access:
      pdu1: {username: redfish, password: changeThis}

    # Inline password. Only used when existingSecret is empty. For an
    # externally-managed Secret, leave this empty and set existingSecret instead.
    password:
  config:
    folder: /config
  port: 9220
  # Timeout for scraping upstream Redfish APIs. Maps to --scrape-timeout.
  scrape:
    timeout: 30s

# Image used by the Helm test hook (templates/tests/test-connection.yaml) that
# curls the /healthz and /ready endpoints. Parameterized so environments that
# cannot pull from Docker Hub (e.g. a Greenhouse dev-env whose registry mirror
# rejects Docker-format manifests) can point it at a reachable registry/tag.
testConnection:
  image:
    repository: curlimages/curl
    tag: "8.11.1"
    pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created.
  create: true
  # Annotations to add to the service account.
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template.
  name: ""

# Redfish scrape configuration.
redfish:
  # Username used for Redfish session authentication.
  username: redfish

  # The password is ALWAYS consumed from a mounted file, never an environment
  # variable. There are two mutually exclusive ways to supply it:
  #
  # 1. existingSecret: reference a pre-created, externally-managed Kubernetes
  #    Secret (recommended when the Secret is managed outside the chart).
  # 2. password: provide the value inline and let the chart render a Secret.
  #    Used for self-contained / local (kind) deployments AND by Greenhouse:
  #    a Plugin's redfish.password (valueFrom.secret) feeds this value.
  #
  # In both cases the Secret is projected into the pod as a read-only file.
  existingSecret: ""
  # Key within the Secret that holds the password.
  secretKey: redfish_password
  # Inline password. Only used when existingSecret is empty. For an
  # externally-managed Secret, leave this empty and set existingSecret instead.
  password: ""

  # Directory the credentials file is mounted into. Maps to --config-folder.
  configFolder: /config
  # File name holding the password. Maps to --redfish-credentials-file.
  # The container reads <configFolder>/<credentialsFileName>.
  credentialsFileName: redfish_password

service:
  type: ClusterIP
  port: 9220
  # Extra annotations for the Service (e.g. greenhouse.sap/expose: "true").
  annotations: {}

# Prometheus Operator ServiceMonitor. Disabled by default; the Service is still
# scrapeable directly. rootstock uses a multi-target probe pattern, so a plain
# ServiceMonitor scraping /metrics only exposes the exporter's own metrics.
serviceMonitor:
  enabled: false
  interval: 30s
  path: /metrics
  honorLabels: true
  # Extra labels to attach so the Prometheus Operator selects this monitor.
  labels: {}

# Pod-level annotations and labels.
podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65531
  runAsGroup: 65531
  fsGroup: 65531
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

# Liveness/readiness probe tuning. Endpoints are served by rootstock itself.
livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 15
readinessProbe:
  httpGet:
    path: /ready
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

nodeSelector: {}
tolerations: []
affinity: {}

# Greenhouse injects a global.greenhouse.* block into every plugin's values.
# Declared here so chart rendering does not fail when it is absent.
global:
  greenhouse: {}

translations:
# source:
  # "PolyPhaseCurrentAmps": {
  #   "Line1": {
  #     "DataSourceUri": "/redfish/v1/PowerEquipment/RackPDUs/1/Sensors/CurrentD",
  #     "Reading": 1.9229999780654907
  #   },
  #   "PowerWatts": {
  #     "DataSourceUri": "/redfish/v1/PowerEquipment/RackPDUs/1/Sensors/PowerD",
  #     "Reading": 442.0060119628906,
  #     "ApparentVA": 444.5360107421875,
  #     "ReactiveVAR": 42.095001220703125,
  #     "PowerFactor": 0.9940000176429749
  #   }
  # }
# target:

  - forDevice:
      manufactorer: ...
      type: ...
      version: ...
      protocol: redfish
    metrics:
    - inputs:
      - .PolyPhaseCurrentAmps.Line1
      - .PolyPhaseCurrentAmps.PowerWatts
      # use gotemplate for target structure (https://pkg.go.dev/text/template#example-Template)
      template:  |
        polyPhaseCurrent:
          line:
            value: {{ .Line1.Reading }}
            unit: A
          power:
            value {{ .PowerWatts.Reading }}
            unit: W
          apparent:
            value {{ .PowerWatts.ApparentVA }}
            unit: VA
          reactive:
            value {{ .PowerWatts.ReactiveVAR }}
            unit: VA

