# Default values for the rootstock chart.

# Number of rootstock replicas. rootstock is a stateless multi-target probe
# exporter, so it can be scaled horizontally if needed.
replicaCount: 1

image:
  # Container image repository for rootstock.
  repository: ghcr.io/cloudoperators/rootstock
  # Image tag. Defaults to the chart appVersion when left empty.
  tag: ""
  # Image digest. Takes precedence over tag when set (e.g. sha256:...).
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created.
  create: true
  # Annotations to add to the service account.
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template.
  name: ""

# Redfish scrape configuration.
redfish:
  # Username used for Redfish session authentication.
  username: redfish

  # The password is ALWAYS consumed from a mounted file, never an environment
  # variable. There are two mutually exclusive ways to supply it:
  #
  # 1. existingSecret: reference a pre-created Kubernetes Secret (recommended;
  #    this is also the path a Greenhouse Plugin's valueFrom.secret feeds into).
  # 2. password: provide the value inline and let the chart render a Secret for
  #    self-contained / local (kind) deployments.
  #
  # In both cases the Secret is projected into the pod as a read-only file.
  existingSecret: ""
  # Key within the Secret that holds the password.
  secretKey: redfish_password
  # Inline password. Only used when existingSecret is empty. Leave empty in
  # production and supply existingSecret instead.
  password: ""

  # Directory the credentials file is mounted into. Maps to --config-folder.
  configFolder: /config
  # File name holding the password. Maps to --redfish-credentials-file.
  # The container reads <configFolder>/<credentialsFileName>.
  credentialsFileName: redfish_password

# HTTP server configuration.
server:
  # Port the rootstock REST server listens on. Maps to --port.
  port: 9220
  # Timeout for scraping upstream Redfish APIs. Maps to --scrape-timeout.
  scrapeTimeout: 30s

service:
  type: ClusterIP
  port: 9220
  # Extra annotations for the Service (e.g. greenhouse.sap/expose: "true").
  annotations: {}

# Prometheus Operator ServiceMonitor. Disabled by default; the Service is still
# scrapeable directly. rootstock uses a multi-target probe pattern, so a plain
# ServiceMonitor scraping /metrics only exposes the exporter's own metrics.
serviceMonitor:
  enabled: false
  interval: 30s
  path: /metrics
  honorLabels: true
  # Extra labels to attach so the Prometheus Operator selects this monitor.
  labels: {}

# Pod-level annotations and labels.
podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

# Liveness/readiness probe tuning. Endpoints are served by rootstock itself.
livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 15
readinessProbe:
  httpGet:
    path: /ready
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

nodeSelector: {}
tolerations: []
affinity: {}

# Greenhouse injects a global.greenhouse.* block into every plugin's values.
# Declared here so chart rendering does not fail when it is absent.
global:
  greenhouse: {}
