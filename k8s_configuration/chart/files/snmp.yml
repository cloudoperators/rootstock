# SNMP Exporter Configuration
# This file defines SNMP modules for monitoring network devices
# See: https://github.com/prometheus/snmp_exporter/tree/main/generator

modules:
  # Basic network interface monitoring
  if_mib:
    walk:
      - 1.3.6.1.2.1.2        # IF-MIB
      - 1.3.6.1.2.1.31.1.1   # IF-MIB extensions
    metrics:
      - name: sysUpTime
        oid: 1.3.6.1.2.1.1.3
        type: gauge
        help: The time since the network management portion of the system was last re-initialized.
      - name: ifNumber
        oid: 1.3.6.1.2.1.2.1
        type: gauge
        help: The number of network interfaces present on this system.

  # Add more modules as needed
  # Example: PDU monitoring
  # pdu_apc:
