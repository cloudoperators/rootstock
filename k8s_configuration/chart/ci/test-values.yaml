# Minimal values for `helm lint` / `helm template` in CI.
# Uses the inline-password (self-contained) mode so no external Secret is required.
image:
  repository: rootstock
  tag: "0.1.0"
  pullPolicy: IfNotPresent

redfish:
  username: admin
  password: "test-password"

serviceMonitor:
  enabled: false
