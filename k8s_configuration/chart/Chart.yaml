apiVersion: v2
name: rootstock
description: A Helm chart for rootstock, a data-center energy/carbon telemetry collector that scrapes Redfish targets and exposes Prometheus metrics.

# A chart can be either an 'application' or a 'library' chart. rootstock ships as
# a deployable application chart that is also compatible with Greenhouse plugins.
type: application

# For ease of tooling, chart version and application version are tied together in
# rootstock: each change to the chart updates this field and each change to the rootstock
# application updates it as well
version: "0.2.0"
