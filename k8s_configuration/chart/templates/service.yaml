apiVersion: v1
kind: Service
metadata:
  name: {{ include "rootstock.fullname" . }}
  namespace: {{ include "rootstock.namespace" . }}
  labels:
    {{- include "rootstock.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    {{- if .Values.snmpExporter.enabled }}
    - port: {{ .Values.snmpExporter.service.port }}
      targetPort: snmp-metrics
      protocol: TCP
      name: snmp-metrics
    {{- end }}

  selector:
    {{- include "rootstock.selectorLabels" . | nindent 4 }}
