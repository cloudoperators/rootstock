{{- if not .Values.redfish.existingSecret }}
{{- if not .Values.redfish.password }}
{{- fail "redfish.password must be set when redfish.existingSecret is empty" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "rootstock.redfishSecretName" . }}
  labels:
    {{- include "rootstock.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.redfish.secretKey }}: {{ .Values.redfish.password | quote }}
{{- end }}
