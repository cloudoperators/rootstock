{{- if not .Values.rootstock.redfish.existingSecret }}
{{- if not .Values.rootstock.redfish.access }}
{{- fail "rootstock.redfish.access must be set when rootstock.redfish.existingSecret is empty" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: redfish-pdu-access
  namespace: {{ include "rootstock.namespace" . }}
  labels:
    {{- include "rootstock.labels" . | nindent 4 }}
type: Opaque
stringData:
  redfish_pdus.yaml: |
    {{- .Values.rootstock.redfish.access | toYaml | nindent 4 }}
{{- end }}
