{{- if .Values.snmpExporter.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "rootstock.fullname" . }}-snmp-config
  namespace: {{ include "rootstock.namespace" . }}
  labels:
    {{- include "rootstock.labels" . | nindent 4 }}
data:
  snmp.yml: |
    {{- toYaml .Values.snmpExporter.config | nindent 4 }}
{{- end }}
