<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 80" width="240" height="80" role="img" aria-label="rootstock logo">
  <title>rootstock</title>
  <!--
    vexjoy-design: macro=logo theme=forest-technical contrast=pass nav=none footer=none mobile=pass

    ANTI-CLICHE PASS:
    Rejected: leaf, sprout, tree silhouette, circuit traces, hexagon, lightning bolt.
    Rejected: stroke-based lines (old version failure — thalamus style is fill-only).
    Rejected: uniform-width bars (tapered gives structural weight, reads as grown not drawn).

    MARK GEOMETRY (thalamus-style fill-only):
    - Top cap: filled circle (signal origin / PDU endpoint)
    - Telemetry stem: tapered filled rectangle, wider at node, narrower at top
    - Central node: filled circle
    - Three root branches: tapered filled polygons, wider at node, narrower at tips
    - Terminal dots: filled circles at branch ends
    - Two sub-rootlets: ghosted filled polygons (opacity 0.5) — rhizome secondary growth

    Zero stroke attributes on structural paths. Opacity sub-elements allowed.
  -->

  <!-- === MARK (local coords, offset by translate(8,4)) === -->
  <g transform="translate(8,4)" fill="#2d6a4f">

    <!-- Top cap: filled circle (thalamus neuron-dot style) -->
    <circle cx="24" cy="5.5" r="2.5"/>

    <!-- Telemetry stem: tapered filled bar (wide at node base, narrow at top cap) -->
    <!-- Points: wide end at y=22.5 (node top), narrow end at y=8 -->
    <polygon points="25.60,22.50 22.40,22.50 22.90,8.00 25.10,8.00"/>

    <!-- Central node: filled circle -->
    <circle cx="24" cy="26" r="4"/>

    <!-- Root branch 1: descends left ~-38° — tapered wider at node -->
    <polygon points="22.47,28.55 25.53,30.45 10.85,52.53 9.15,51.47"/>
    <!-- Terminal dot branch 1 -->
    <circle cx="10" cy="52" r="2.2"/>

    <!-- Root branch 2: descends near-center-left ~-12° -->
    <polygon points="22.22,29.22 25.78,29.78 20.99,55.15 19.01,54.85"/>
    <!-- Terminal dot branch 2 -->
    <circle cx="20" cy="55" r="2.2"/>

    <!-- Root branch 3: descends right ~+32° -->
    <polygon points="22.47,30.45 25.53,28.55 38.85,51.47 37.15,52.53"/>
    <!-- Terminal dot branch 3 -->
    <circle cx="38" cy="52" r="2.2"/>

    <!-- Sub-rootlet A: from branch 1 mid-point, ghosted -->
    <polygon points="14.48,42.27 15.52,43.73 8.52,48.73 7.48,47.27" opacity="0.5"/>
    <circle cx="8" cy="48" r="1.6" opacity="0.5"/>

    <!-- Sub-rootlet B: from branch 3 mid-point, ghosted -->
    <polygon points="32.55,43.78 33.45,42.22 40.45,46.22 39.55,47.78" opacity="0.5"/>
    <circle cx="40" cy="47" r="1.6" opacity="0.5"/>

  </g>

  <!-- === WORDMARK === -->
  <text
    x="68"
    y="44"
    font-family="'DM Sans','Barlow Condensed','Montserrat','Work Sans',sans-serif"
    font-size="22"
    font-weight="300"
    letter-spacing="0.04em"
    fill="#1a1a1a"
    dominant-baseline="middle"
  >rootstock</text>

</svg>
