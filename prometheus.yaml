scrape_configs:
  - job_name: "rootstock-pdu1"
    scrape_interval: 1m
    scrape_timeout: 30s
    metrics_path: /probe

    static_configs:
      - targets:
          - https://10.114.68.4
        labels:
          pdu_id: "1"

    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target

      - source_labels: [pdu_id]
        target_label: __param_labels

      - target_label: __address__
        replacement: host.docker.internal:9220

  - job_name: "rootstock-pdu2"
    scrape_interval: 1m
    scrape_timeout: 30s
    metrics_path: /probe

    static_configs:
      - targets:
          - https://10.114.68.4
        labels:
          pdu_id: "2"

    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target

      - source_labels: [pdu_id]
        target_label: __param_labels

      - target_label: __address__
        replacement: host.docker.internal:9220
