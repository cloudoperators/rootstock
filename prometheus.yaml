scrape_configs:
  - job_name: "rootstock"
    scrape_interval: 30s
    metrics_path: /probe

    static_configs:
      - targets:
          - http://localhost:8000
        labels:
          pdu_id: "pdu01"
          collect: "rackpdu,environmentalsensors"
      - targets:
          - http://localhost:8000
        labels:
          pdu_id: "pdu02"
          collect: "rackpdu"

    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target

      - source_labels: [pdu_id]
        target_label: __param_labels

      - source_labels: [collect]
        target_label: __param_collect

      - target_label: __address__
        replacement: host.docker.internal:9220
